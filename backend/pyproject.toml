[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long one-line assertions read better than wrapped ones
"scripts/seed.py" = ["E501"]  # sample-data tables read better one row per line

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
